<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MellowUI-Utilities Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mellowui-utilities@1.3.2/dist/css/mellowui-utilities.min.css">
</head>

<body>
  <main class="container py-3">
    <h1 class="text-primary mb-0">Hello, World!</h1>
    <hr>
    <p class="text-secondary">Showcasing some MellowUI-Utilities Demo</p>
    <a href="#">Inline Link</a>
    <a href="#" class="link-primary">Inline Colored Link</a>
    <a href="#" class="link-secondary">Inline Colored Link</a>
    <a href="#" class="link-success">Inline Colored Link</a>
    <div class="vstack gap-3 p-3 mt-3 border rounded-2 mellow-shadow shadow-hover-lg transition-fast transition-shadow bg-white" style="max-width: 540px">
      <h3 class="text-primary m-0">Premium Card</h3>
      <p class="text-muted m-0">This card lifts up smoothly using MellowUI's custom shadow transitions on hover!</p>
      <div class="hstack gap-2 justify-content-end">
        <button class="focus-ring focus-ring-primary">Action</button>
      </div>
    </div>
    <div class="row g-0 gap-3 mt-3">
      <div class="col-12 col-md">
        <div class="p-5 border rounded-1 shadow-sm"></div>
      </div>
      <div class="col-12 col-md">
        <div class="p-5 border rounded-1 shadow"></div>
      </div>
      <div class="col-12 col-md">
        <div class="p-5 border rounded-1 shadow-lg"></div>
      </div>
      <div class="col-12 col-md">
        <div class="p-5 border rounded-1 mellow-shadow-soft"></div>
      </div>
      <div class="col-12 col-md">
        <div class="p-5 border rounded-1 mellow-shadow-sm"></div>
      </div>
      <div class="col-12 col-md">
        <div class="p-5 border rounded-1 mellow-shadow"></div>
      </div>
      <div class="col-12 col-md">
        <div class="p-5 border rounded-1 mellow-shadow-lg"></div>
      </div>
    </div>
  </main>
</body>

</html>
